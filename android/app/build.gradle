plugins {
    id "com.android.application"
}

android {
    namespace = "br.otavio.oabtreino"
    compileSdk = 35

    defaultConfig {
        applicationId = "br.otavio.oabtreino"
        minSdk = 24
        // ponytail: targetSdk 34 evita a borda-a-borda obrigatória do Android 15 e o "voltar preditivo" do Android 16;
        // subir só se um dia for para a Play Store.
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
    }

    // Chave fixa dentro do projeto: toda versão nova instala por cima da antiga sem apagar o progresso.
    signingConfigs {
        debug {
            storeFile = file("../assinatura.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
    }

    // A interface é a pasta web/ do projeto (HTML/CSS/JS + questoes.js)
    sourceSets {
        main {
            assets.srcDirs = ["../../web"]
        }
    }
}
